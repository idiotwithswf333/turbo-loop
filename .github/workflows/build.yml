name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/TurboLoop | Out-Null
          Copy-Item build/Release/turboloop.exe dist/TurboLoop/TurboLoop.exe
          Copy-Item README.md dist/TurboLoop/
          Compress-Archive -Path dist/TurboLoop -DestinationPath dist/TurboLoop-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TurboLoop-windows-x64
          path: dist/TurboLoop

      # Tag a commit (for example v1.0) and the zip is attached to a GitHub Release.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TurboLoop-windows-x64.zip
